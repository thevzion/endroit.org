name: Qualify static site

on:
  push:
    branches: [main, codex/cloudflare-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Qualify static site
        run: |
          npm ci
          npm test
      - name: Preserve qualified static artifact
        uses: actions/upload-artifact@v4
        with:
          name: endroit-static-${{ github.sha }}
          path: |
            dist/
            wrangler.json
            wrangler.staging.json
            nginx.staging.conf
          if-no-files-found: error
          retention-days: 30
