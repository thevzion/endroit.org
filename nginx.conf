server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /home-first {
    return 301 https://thevzion.com/home-first/;
  }

  location = /home-first/ {
    return 301 https://thevzion.com/home-first/;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
